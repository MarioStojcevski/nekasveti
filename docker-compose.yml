services:
  web:
    build:
      context: .
      args:
        # Public values are baked into the client bundle during the build.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    # Runtime (server-only) secrets are read from .env at container start.
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
